[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synbioscout-scientist"
version = "0.3.1"
description = "Evidence-grounded dual-route AI Scientist integrated with Target2Lead"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3", "requests>=2.31", "jsonschema>=4.20",
  "biopython>=1.83", "rdkit>=2024.3", "numpy>=1.26", "pandas>=2.1",
  "scipy>=1.11", "matplotlib>=3.8", "fastapi>=0.115", "uvicorn>=0.30"
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
paperqa = ["paper-qa>=5"]
tooluniverse = ["tooluniverse"]

[project.scripts]
synbioscout = "scientist.cli:main"

[tool.setuptools.packages.find]
include = ["scientist*", "target2lead*"]

[tool.setuptools.package-data]
scientist = ["web/*", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: explicitly requested live external API or LLM integration tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

